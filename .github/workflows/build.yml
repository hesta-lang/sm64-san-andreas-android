name: Build Android AML plugin with libsm64

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install libsm64 source
        run: |
          git clone --depth 1 https://github.com/libsm64/libsm64.git deps/libsm64
          python3 --version
          cd deps/libsm64
          python3 import-mario-geo.py

      - name: Get Android GTA SA plugin SDK support files
        run: |
          git clone --depth 1 https://github.com/kudanilll/gtasa-android-plugins-base.git deps/base

      - name: Verify libsm64 generated sources
        run: |
          test -s deps/libsm64/src/libsm64.h
          test -s deps/libsm64/src/decomp/mario/geo.inc.c
          test -s deps/libsm64/src/decomp/mario/model.inc.c
          echo "libsm64 source and generated Mario geometry are present."

      - name: Build GTA SA v2.00 with libsm64 (armeabi-v7a)
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk NDK_DEBUG=0 V=1

      - name: Verify linked libsm64 symbols
        run: |
          NDK_ROOT="$(dirname "$(readlink -f "$(command -v ndk-build)")")"
          LLVM_NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$LLVM_NM"
          "$LLVM_NM" -D libs/armeabi-v7a/libsm64sanandreas.so | grep -E 'sm64_global_init|sm64_mario_create|sm64_mario_tick'
          file libs/armeabi-v7a/libsm64sanandreas.so

      - name: Stage plugin
        run: |
          mkdir -p dist
          cp libs/armeabi-v7a/libsm64sanandreas.so dist/libsm64sanandreas.so

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: sm64-san-andreas-android-0.2.0-alpha-armeabi-v7a
          path: dist/libsm64sanandreas.so
          if-no-files-found: error
